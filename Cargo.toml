[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
libc = "0.2"
config = { path = "crates/config" }
jpeg = { path = "crates/jpeg" }
render = { path = "crates/render" }
sys = { path = "crates/sys" }
wire = { path = "crates/wire" }
wm = { path = "crates/wm" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The wallpaper is decoded at startup; keep that fast in debug builds too.
[profile.dev.package.jpeg]
opt-level = 3
