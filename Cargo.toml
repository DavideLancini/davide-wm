[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
bar = { path = "crates/bar" }
libc = "0.2"
fontdue = "0.9"
# HTTPS for the Spotify Web API: rustls rather than OpenSSL, so no system
# library is needed.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
config = { path = "crates/config" }
dbus = { path = "crates/dbus" }
jpeg = { path = "crates/jpeg" }
launcher = { path = "crates/launcher" }
render = { path = "crates/render" }
state = { path = "crates/state" }
sys = { path = "crates/sys" }
wire = { path = "crates/wire" }
wm = { path = "crates/wm" }
x11 = { path = "crates/x11" }
pipewire = { path = "crates/pipewire" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The wallpaper is decoded at startup; keep that fast in debug builds too.
[profile.dev.package.jpeg]
opt-level = 3
